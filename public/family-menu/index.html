<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f3eb">
  <meta name="description" content="家庭菜单 Family Menu">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <link rel="icon" href="/favicon.png">
  <link rel="stylesheet" href="/family-menu/styles.css">
  <title>家庭菜单 Family Menu</title>
</head>
<body data-role="__ROLE__" data-location="__LOCATION__">
  <a class="skip-link" href="#menuRoot">跳到餐单 Skip to menu</a>
  <div class="shell menu-on">
    <header class="hdr">
      <div class="hdr-main">
        <a class="brand" href="/tomorrow" aria-label="家庭菜单首页">
          <span class="brand-mark" aria-hidden="true">♨</span>
          <span class="brand-t"><strong>家庭菜单</strong><small>Family Menu</small></span>
        </a>
        <div class="k-switch" id="kSwitch" role="group" aria-label="切换厨房 Kitchen switch">
          <button class="k-btn" type="button" data-location="shenzhen">深圳<small>SHENZHEN</small></button>
          <button class="k-btn" type="button" data-location="hongkong">香港<small>HONG KONG</small></button>
        </div>
      </div>
      <nav class="day-nav" id="dayNav" aria-label="日期导航"></nav>
    </header>

    <div class="k-banner">
      <span class="k-icon" aria-hidden="true">⌖</span>
      <span class="k-copy"><small>当前厨房 KITCHEN</small><strong id="kName">加载中 Loading</strong></span>
      <span class="readonly-pill">只读 READ ONLY</span>
    </div>

    <main id="menuRoot" class="menu-page" tabindex="-1" aria-live="polite">
      <section class="loading" id="loading">
        <span></span><span></span><span></span>
        <p>正在读取真实餐单<br><small>LOADING LIVE MENU</small></p>
      </section>
    </main>

    <nav class="b-nav" aria-label="主导航">
      <div class="b-nav-in">
        <a class="n-tab active" href="/tomorrow"><span aria-hidden="true">▦</span><b>餐单</b><small>PLAN</small></a>
        <a class="n-tab" href="/pantry"><span aria-hidden="true">▣</span><b>食材</b><small>PANTRY</small></a>
        <a class="n-tab" href="/dishes"><span aria-hidden="true">♨</span><b>菜品</b><small>DISHES</small></a>
        <a class="n-tab" href="/history"><span aria-hidden="true">◷</span><b>历史</b><small>HISTORY</small></a>
      </div>
    </nav>
  </div>
  <script src="/family-menu/app.js" defer></script>
</body>
</html>
