name: Nanny Reminder 20:00

on:
  # Task C1: production schedule moved to the Lighthouse systemd timer.
  # Manual trigger remains only for repository history/diagnostics.
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Send nanny reminder
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      run: |
        if [ -z "$PUSHPLUS_TOPIC" ]; then
          export PUSHPLUS_TOPIC="home-menu"
        fi
        python3 nanny_reminder.py --time 20:00
