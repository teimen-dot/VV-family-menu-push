name: Daily Menu Push

on:
  # 定时触发：UTC 02:30 = 北京时间/香港时间 10:30
  # 修改推送时间：修改下面 cron 表达式
  # 例如 UTC 00:00 = 北京时间 08:00 → cron: '0 0 * * *'
  schedule:
    - cron: '30 2 * * *'
  # 手动触发（用于测试）
  workflow_dispatch:

jobs:
  push-menu:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Push daily menu
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      run: |
        # 如果未设置 PUSHPLUS_TOPIC，使用默认值
        if [ -z "$PUSHPLUS_TOPIC" ]; then
          export PUSHPLUS_TOPIC="home-menu"
        fi
        python3 push_menu.py
