name: Daily Menu Push

on:
  # Task A: legacy 10:30 JSON push disabled. Manual trigger retained for audit only.
  workflow_dispatch:

jobs:
  push-menu:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    - name: Push daily menu
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      run: |
        # 如果未设置 PUSHPLUS_TOPIC，使用默认值
        if [ -z "$PUSHPLUS_TOPIC" ]; then
          export PUSHPLUS_TOPIC="home-menu"
        fi
        python3 push_menu.py
