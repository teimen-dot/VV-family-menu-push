name: Nanny Reminder 19:00

on:
  schedule:
    # UTC 11:00 = 北京时间/香港时间 19:00
    - cron: '0 11 * * *'
  workflow_dispatch:

jobs:
  remind:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Send nanny reminder
      env:
        PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
        PUSHPLUS_TOPIC: ${{ secrets.PUSHPLUS_TOPIC }}
      run: |
        if [ -z "$PUSHPLUS_TOPIC" ]; then
          export PUSHPLUS_TOPIC="home-menu"
        fi
        python3 nanny_reminder.py --time 19:00
